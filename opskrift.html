<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet/index.css">
    <link rel="stylesheet" href="stylesheet/opskrifter.css">
</head>
<body>
    <h1 class="header" >Opskrifter til dine rester</h1>

    <div class="search-recipes">
        <textarea class="search" placeholder="Søg opskrifter"></textarea>
     </div>

    <h3 class="forslag"> Forslag til opskrifter </h3>

    <div class="recipes">
        <div class="hurtig">
            <img src="pictures/hurtig.png" alt="hurtig" class="hurtig">
            <div class="tekst">
                <p> <span class="gul"> Hurtig </span> <span class="rød">15 MIN</span> </p>
                <p class="ret"> Grønstagssuppe</p>
                <button>Vis opskrift</button>
            </div>
        </div>
    
        <div class="nem">
            <img src="pictures/nem.png" alt="nem" class="nem">
            <div class="tekst">
                <p> <span class="gul"> Nem </span> <span class="rød">20 MIN</span> </p>
                <p class="ret"> Pasta med grøntsager</p>
                <button>Vis opskrift</button>
            </div>
        </div>
        
        <div class="mættende">
            <img src="pictures/mættende.png" alt="mættende" class="mættende">
            <div class="tekst">
                <p> <span class="gul"> Mættende </span> <span class="rød">25 MIN</span> </p>
                <p class="ret"> kylling og risret</p>
                <button>Vis opskrift</button>
            </div>
        </div>

        <div class="dessert">
            <img src="pictures/dessert.png" alt="dessert" class="dessert">
            <div class="tekst">
                <p> <span class="gul"> Dessert </span> <span class="rød">15 MIN</span> </p>
                <p class="ret"> Chokoladekage</p>
                <button>Vis opskrift</button>
            </div>
        </div>

    </div>

    <div class="footer">
        

    </div>
    
</body>
</html>
