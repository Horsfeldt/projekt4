<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret bruger</title>
    <link rel="stylesheet" href="stylesheet/style.css">
    <link rel="stylesheet" href="stylesheet/index.css">
    <script src="js/script.js" defer></script>
</head>



<body>
<div class="phone-page">


     <div class="statusbar">

    <p class="tid">09:41</p>

    <div class="dynamic-island"></div>

    <div class="status-ikoner">

        <img src="img/forbindelse-ikon.png">
        <img src="img/wifi-ikon.png">
        <img src="img/batteri-ikon.png">
    </div>
     </div>




    <div class="container">


    <img src="img/delmad-logo.png" class="delmad-logo">
  
        

    <div class="opret-tekst">
        <h1>Opret bruger</h1>
        <p>Opret en bruger og kom igang med at reducere madspild</p>
    </div>

</div>

<div class="bruger-felter">
    
<label for="navn">Navn</label>
<input type="text" id="navn" placeholder="Indtast dit navn"> 

<label for="email">E-mail</label>
<input type="email" id="email" placeholder="Indsast din e-mail">

<label for="password">Adgangskode</label>
<input type="password" id="password" placeholder="Indsast adgangskode">

<label for="password2">Gentag adgangskode</label>
<input type="password" id="password2" placeholder="Gentag adgangskode">


<div class="checkbox">
    <input type="checkbox" id="betingelser">
    <label for="betingelser">Jeg accepterer bestingelserne</label>
</div>

<button class="opret-btn2" onclick="opretBruger()">Opret bruger</button>

<p class="har-bruger"> Har du allerede en bruger? <span onclick="goToLogin()" class="logind-link">Log ind</span></p>


  </div>
</div>
</body>


</html>
