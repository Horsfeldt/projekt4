<!DOCTYPE html>
<html lang="da">
<head>

  <title>Favoritter</title>
  <link rel="stylesheet" href="opskrifter.css">

<body>
  <header>

    <p class="subtitle">Brug dine rester</p>

  <main>
    <div class="card">
      <img src="C:\Users\marcm\Downloads\Thumbnail.jpg" alt="Grøntsagssuppe">
      <div class="card-info">
        <p class="tag hurtig">Hurtig <span class="time-tag">15 MIN</span></p>
        <h3>Grøntsagssuppe</h3>
        <button class="btn">Vis opskrift</button>
      </div>
    </div>

    <div class="card">
      <img src="C:\Users\marcm\Downloads\Thumbnail2.jpg" alt="Pasta med grøntsager">

    <div class="card">
      <img src="C:\Users\marcm\Downloads\Thumbnail3.jpg" alt="Kylling og risret">
      <div class="card-info">
        <p class="tag maettende">Mættende <span class="time-tag">25 MIN</span></p>

        <button class="btn">Vis opskrift</button>
      </div>
    </div>

    <div class="card">
      <img src="C:\Users\marcm\Downloads\Thumbnail4.jpg" alt="Havregrød tærte med frugt">
      <div class="card-info">
        <p class="tag dessert">Dessert <span class="time-tag">30 MIN</span></p>
        <h3>Havregrød tærte med frugt</h3>
        <button class="btn">Vis opskrift</button>
      </div>
    </div>
  </main>

   <footer>
    <div class="footer-item"><img src="bundmenu1.png" alt="Billeder"></div>
    <div class="footer-item"><img src="bundmenu2.png" alt="Brugere"></div>
    <div class="footer-item"><img src="bundmenu3.png" alt="Indkøbskurv"></div>
    <div class="footer-item"><img src="bundmenu4.png" alt="Opskrifter"></div>

  </footer>

  <script src="opskrift.js"></script>
