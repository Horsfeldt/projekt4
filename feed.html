<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed</title>
  <link rel="stylesheet" href="stylesheet/feed.css">
	<link rel="stylesheet" href="stylesheet/index.css">
  <link rel="stylesheet" href="stylesheet/style.css">
  <script src="js/feed.js" defer></script>
	<script src="js/script.js" defer></script>
  
</head>
<body>
<div class="phone-page">

  <div class="statusbar">
    <p class="tid">09:41</p>
    <div class="dynamic-island"></div>
    <div class="status-ikoner">
      <img src="img/forbindelse-ikon.png" alt="">
      <img src="img/wifi-ikon.png" alt="">
      <img src="img/batteri-ikon.png" alt="">
    </div>
  </div>

  <header>
    <span class="header-plus" role="img" aria-label="Tilføj">+</span>
    <img class="header-heart" src="img/hjerte-ikon.png" alt="Favoritter">
    <h1>Feed</h1>
    <div class="profile-row">
      <div class="profile">
        <img src="img/profilbillede1.png" alt="">
        <span>Karoline</span>
      </div>
      <div class="profile">
        <img src="img/profilbillede2.png" alt="">
        <span>Jonas</span>
      </div>
      <div class="profile">
        <img src="img/profilbillede3.png" alt="">
        <span>Simon</span>
      </div>
      <div class="profile">
        <img src="img/profilbillede4.png" alt="">
        <span>Emma</span>
      </div>
      <div class="profile">
        <img src="img/profilbillede5.png" alt="">
        <span>Freja</span>
      </div>
      <div class="profile">
        <img src="img/profilbillede6.png" alt="">
        <span>Lara</span>
      </div>
    </div>
    <input type="text" aria-label="Søg efter opskrifter eller brugere" placeholder="Søg efter opskrifter eller brugere">
  </header>

  <main>
    <div class="post">
      <div class="user">Rasmus</div>
      <img src="img/madpandekager.png" alt="Madpandekager">
      <p>I dag har jeg lavet madpandekager af mine rester</p>
      <div class="actions">
        <button class="like" aria-label="Synes godt om">👍</button>
        <button aria-label="Kommenter">💬</button>
      </div>
    </div>

    <div class="post">
      <div class="user">Camilla</div>
      <img src="img/pasta-med-grøntsager2.png" alt="Pasta med grøntsager">
      <p>Jeg har lavet pasta med ærterne! :)</p>
      <div class="actions">
        <button class="like" aria-label="Synes godt om">👍</button>
        <button aria-label="Kommenter">💬</button>
      </div>
    </div>

    <div class="post">
      <div class="user">Veronica</div>
      <img src="img/lasagne.png" alt="Lasagne">
      <div class="actions">
        <button class="like" aria-label="Synes godt om">👍</button>
        <button aria-label="Kommenter">💬</button>
      </div>
    </div>
  </main>

				<nav class="bottom-nav" aria-label="Hovednavigation">

			<a href="feed.html" class="nav-item" aria-label="Billeder">
				<img src="pictures/feedIconSort.png" alt="feed">
			</a>

			<a href="events.html" class="nav-item" aria-label="Fællesskab">
				<img src="pictures/eventIcon.png" alt="event">
			</a>

			<a href="reserver.html" class="nav-item" aria-label="Overskudsmad">
				<img src="pictures/reserverIcon.png" alt="reserver">
			</a>

			<a href="opskrift.html" class="nav-item" aria-label="Opskrifter">
				<img src="pictures/opskriftIconLys.png" alt="opskrift">
			</a>

			<a href="profil.html" class="nav-item" aria-label="Profil">
				<img src="pictures/profilIcon.png" alt="profil">
			</a>

		</nav>
  </div>
</body>
</html>
