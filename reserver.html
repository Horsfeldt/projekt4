<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet/index.css">
    <link rel="stylesheet" href="stylesheet/reserver.css">
    <script src="js/reserver.js" defer></script>
</head>
<body>


    <div class="kurv">
        <img src="pictures/kurv.png" alt="kurv">
        <h1>Din kurv</h1>

    </div>


    <div class="madvarer">

         <div class="madvarer1">
            <img src="pictures/rødtkød.png" alt="kød">

            
            <div class="btncontainer">
                <h1 class="produkt">Rødt kød</h1>
                <button class="btn minus">-</button>
                <span id="value">0</span>
                <button class="btn plus">+</button>
                <button class="btn slet">Slet</button>
                <h3 class="gratis">GRATIS</h3>
            </div>
            
        </div>

        <div class="madvarer2">
            <img src="pictures/sødmælk.png" alt="mælk">    
             <div class="btncontainer">
                <h1 class="produkt">Sødmælk</h1>
                <button class="btn minus">-</button>
                <span id="value">0</span>
                <button class="btn plus">+</button>
                <button class="btn slet">slet</button>
                <h3 class="gratis">GRATIS</h3>
            </div>
        </div>
    
        <div class="madvarer3">
            <img src="pictures/æg.png" alt="æg">
             <div class="btncontainer">
                <h1 class="produkt">4 store æg</h1>
                <button class="btn minus">-</button>
                <span id="value">0</span>
                <button class="btn plus">+</button>
                <button class="btn slet">Slet</button>
                <h3 class="gratis">GRATIS</h3>
            </div>
        </div>
        
        <div class="madvarer4">
            <img src="pictures/ost.png" alt="ost">
             <div class="btncontainer">
                <h1 class="produkt">Mellemlagret ost</h1>
                <button class="btn minus">-</button>
                <span id="value">0</span>
                <button class="btn plus">+</button>
                <button class="btn slet">Slet</button>
                <h3 class="gratis">GRATIS</h3>
            </div>
        </div>

  
    </div>
    <hr>

      <div class="bestilling">
            <div class="total">
                <h2>i alt</h2>   
                <h2>0 kr</h2>
            </div>

            <h2 class="detaljer">Bestillingsdetaljer</h2>
        </div>

    <div class="varer">
        <div class="tekstcontainer">
            <p>vare antal</p>
            <p>status</p>
        </div>
        <div class="vareinfo">
            <span class="vareantal">0</span>
            <p class="bestillingsstatus">Ikke klar til bestiling</p>
        </div>
    </div>

      <div class="bestil">
            <button class="bestilbtn">Bestil</button>
        </div>




    
</body>
</html>
